# skin-test parameters — every tunable number in the rig, in one file.
#
# STRICT-COMPLETE (student-house `bim/phase1/parameters.py`, Duncan 2026-06-11):
# this file specifies EVERY knob. There are no built-in defaults and no partial
# overlay, because a hidden default is exactly what masks a bug. A what-if is a
# full, diffable copy of this file, not an override of it. There is no CLI flag:
# build one with `build(params=parameters.load_validated("what-if.yaml"))`.
# A dict passed that way is schema-validated too — see `parameters.resolve`.
#
# All lengths are METRES. Nothing here is converted at the load seam — the
# student-house converts metres to u/v grid fractions there, and this rig has no
# fractional coordinates to convert to, so a number reaching the geometry is the
# number written here.
#
# What is NOT here, and why:
#   * the face rules (`keep` / `lap`) — code, not numbers. They
#     live in `build.py` keyed by skin name; `skins()` joins the two by name and
#     raises if either side names something the other does not.
#   * `TOL` / `PLANE_TOL` / `RIDGE` — the float32 accuracy floor of manifold3d and
#     the KKT ridge. Not knobs: they describe the arithmetic, not the design.

# `substrate.classify`'s two thresholds — WALL or ROOF from geometry alone.
classify:
  # a horizontality this close to the halfway mark is ambiguous and raises
  margin: 0.05
  # the two smallest OBB extents within this ratio means "block-like": no clear
  # thin direction, so neither panel nor slab, and it raises
  aspect: 0.85

# cos 45 deg. A wall's vertical face counts as exterior or interior when it faces
# along the fall of that wall's own top, and as an end when it lies across it.
fall: 0.707

# The second allowance. A cladding skin stands `distance` off the wall it clads,
# and `reveal` off a substrate feature it dies against instead of covers: the
# soffit and ends of a cornice, and the cheeks of an opening it lines. Duncan,
# 2026-08-27: *"The top of the masonry cladding should be offset by this value
# under a cornice. The cladding should be offset from bottom, and sides of the
# two scuppers by this value."*
#
# One number, top-level rather than per skin, because it is a property of how a
# cladding system meets a substrate feature and not of any one system — both the
# masonry and the rainscreen want the same 18 mm, and two skins each authoring it
# would collide in `check_seeds` as equal seeds.
#
# It **is** a seed and `check_seeds` reads it: it is a distance between two
# surfaces, which is exactly what a bug can swap for another, where `base` is a
# datum and `close` a bound on a cleanup. 0.016 was asked for first and is
# refused — it is 2x `Membrane.distance` — so 0.018 was authored instead
# (Duncan, 2026-08-27, choosing that over moving the membrane off 8 mm).
reveal: 0.018

# The skin distances. NON-DEGENERATE SEEDS (student-house CLAUDE.md, hard
# rule, enforced by `parameters.check_seeds`): no two are equal and none is an
# integer multiple of another. `Membrane.drop` and `Cladding.distance` were both
# 0.100 until 2026-08-14, which meant a bug swapping a skirt depth for an offset
# distance produced identical geometry — invisible to the tests and to the eye.
# Keep them distinct when tuning. A zero **distance of any of the three** is
# exempt: it means the feature is off — the cladding never laps upward or
# sideways, the masonry never hangs a drip — which is a direction being off,
# not a seed.
#
# `base` is a datum, not a seed: it is a height in the model, not a distance
# between two surfaces, so `check_seeds` ignores it and a `base` equal to some
# skin's `distance` is not degenerate. `null` means the skin is not trimmed at
# all — and note that `null` and `0.0` differ here, where for `drop` and `out`
# zero *is* the off switch. A trim height of zero is a real height.
#
# `close` is not a seed either, for the same reason turned the other way up: it
# is a bound on a cleanup, not a distance any surface is built to. It is the
# widest tear `skin/clean.py` will gusset — see "Cleaning a mesh" in CLAUDE.md —
# and zero switches that off. It is authored rather than derived because a
# cleanup may author a bound where a rule may not, and because the obvious
# derivation is wrong: the membrane's one tear is twice the offset across in
# plan, but 18.016 mm along its own sloped plane, so `2 x distance` would miss
# the very tear it was reasoned from.
#
# `rules` names the rule set in `skinning/rules.py` these numbers are built with,
# and `select` says which instance of it this skin is. They were one field —
# the name — until 2026-08-28, when a rule set stopped being one skin: the
# membrane is per roof and the masonry per material. `'*'` fans a rule set out
# over the substrate, one skin per value it carries; a value binds one instance;
# `null` is a rule set that takes no selector at all.
skins:
  - name: Membrane
    rules: Membrane
    select: '*'      # one skin per `roof_zone` the substrate carries — three on
                     # the whole building (`Membrane-Deck9`, `-Unit8`,
                     # `-Headhouse`), one on the rig. Fanned out rather than
                     # authored three times because a roof membrane is ONE
                     # allowance laid on three roofs: three entries repeating
                     # 0.008 would collide in `check_seeds` as equal seeds, and
                     # rightly — nothing distinguishes them but where they are.
                     # A roof that wants its own build-up is a different system
                     # and becomes an entry of its own, like the two masonries
    distance: 0.008
    drop: 0.062      # a lap hanging below its arris — the drip over a coping
    out: 0.205       # a lap rising or running sideways — the upstand at an abutment
    base: null       # nothing of it reaches the ground; nothing to trim
    close: 0.025     # the scupper tear is 18.016 mm across; the narrowest free
                     # edge that must NOT be filled is 248.268 mm
    display: solid
  - name: Cladding
    rules: Cladding
    select: null     # the rainscreen is the residue: it clads every facade no
                     # masonry claims, so there is one of it however many
                     # materials the substrate carries
    distance: 0.085
    drop: 0.033      # down the interior walls, part 4's included. Was 0.030
                     # until 2026-08-26, when the masonry's distance arrived at
                     # 0.150 — exactly 5x it, which `check_seeds` refuses. The
                     # masonry allowance is the authored one of the two, so this
                     # is the number that moved
    out: 0.0         # the cladding never laps upward or sideways
    base: 0.0        # stops at ground level rather than at its own miter, which
                     # would hang `distance` below the substrate's underside
    close: 0.0       # the cladding tears nowhere; nothing to gusset
    display: wire
  - name: Masonry-Brick
    rules: Masonry
    select: brick    # the material stamped on the corniced wall this skin clads
                     # — `Parapet-Unit8-E`, and the street front grown down from
                     # it. See `rules.masonry_faces`
    distance: 0.15   # the finished face of a masonry facade, off the structural
                     # outer face. Copied — not read — from the student-house's
                     # `cladding.allowance.street-front` (0.15, brick veneer +
                     # cavity); nothing here imports anything from that repo.
                     # It checks out against the substrate independently:
                     # `Cornice-Unit8-E` projects 170 mm, and the same file
                     # authors `cornice.projection.street-front` at 0.020, so
                     # the cornice oversails this face by exactly the 20 mm it
                     # is drawn to
    drop: 0.0        # unread: the rule set's `lap` is None. Masonry is
    out: 0.0         # abstracted as a surface until its thickness is drawn
    base: 0.0        # stops at ground level, as the cladding does
    close: 0.0       # nothing to gusset
    display: wire
  - name: Masonry-Firewall
    rules: Masonry
    select: block    # the mitoyen elevation — `Parapet-Deck9-N` and the wall
                     # below it. A second masonry is a second allowance and so a
                     # second skin, which is what `check_cladding` said would be
                     # needed the day a substrate posed one. 2026-08-28: it does
    distance: 0.161  # block 0.140 + a cavity. The cavity is drawn 20 mm in the
                     # student-house, which makes this 0.160 — and 0.160 is
                     # exactly 20x `Membrane.distance`, which `check_seeds`
                     # refuses. The new number is the one that moves, as
                     # `reveal` moved 0.016 -> 0.018 on 2026-08-27 rather than
                     # take the membrane off 8 mm (Duncan, 2026-08-28). The
                     # 1 mm lives in the cavity, which is a site dimension
    drop: 0.0        # unread, as above: `lap` is None
    out: 0.0
    base: 0.0        # stops at ground level, as the brick does
    close: 0.0       # nothing to gusset
    display: wire
